<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0c0f10">
<title>DJ SAMI | Anfragen verwalten</title>
<style>
:root{color-scheme:dark;font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;background:#0c0f10;color:#f5f7f1}
*{box-sizing:border-box}body{margin:0;padding:30px max(20px,4vw);font-size:16px;line-height:1.55}
a{color:#ddf65f}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid #ddf65f;outline-offset:3px}
.head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:26px;border-bottom:1px solid #363f36}
.brand{font-weight:900;letter-spacing:-.06em;font-size:27px}.brand span{color:#ddf65f}.head a{font-size:14px}
.title{font-family:"Avenir Next Condensed","Segoe UI",sans-serif;font-size:clamp(40px,6.4vw,83px);letter-spacing:-.06em;line-height:1.1;margin:38px 0 30px}.title span{color:#ddf65f}
.auth{max-width:580px;border:1px solid #444d43;background:#202721;border-radius:20px;padding:32px}
.auth h2{font-size:24px;margin:0 0 11px}.auth p{color:#c7d0c6;line-height:1.6;margin-bottom:25px}
.auth label{display:block;font-weight:750;font-size:14px;margin-bottom:10px}
input,select{min-height:49px;background:#121713;color:#fff;border:1px solid #586556;border-radius:12px;padding:12px 14px;max-width:100%;font-size:16px}
.auth input{width:100%}
.btn{border:0;background:#ddf65f;color:#142007;font-weight:850;border-radius:12px;min-height:50px;padding:14px 20px}.auth .btn{margin-top:18px}
.toolbar{display:flex;gap:11px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
.toolbar select{min-width:176px}.toolbar input{flex:1;min-width:180px}
.toolbar button{background:#242e26;border:1px solid #465345;color:#fff;border-radius:12px;min-height:46px;padding:10px 17px;font-size:14px}
.toolbar button:hover{border-color:#ddf65f}
.stats{display:flex;gap:11px;flex-wrap:wrap;margin-bottom:24px}
.stat{border:1px solid #455243;background:#1b231c;border-radius:15px;padding:16px 20px;min-width:125px;flex:1}
.stat strong{display:block;font-size:31px;color:#ddf65f;font-weight:850;letter-spacing:-.04em;line-height:1.2}
.stat span{display:block;margin-top:4px;color:#d1dacf;font-size:12px}
.list{display:grid;gap:13px}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;padding:24px;border-radius:18px;border:1px solid #3f493e;background:#1d251e}
.item h2{font-size:23px;line-height:1.2;letter-spacing:-.04em;margin:0 0 9px}
.item small{color:#bbc7b9;font-size:13px}
.meta{display:flex;gap:10px 24px;flex-wrap:wrap;font-size:14px;color:#d0d6ce;margin-top:16px}
.message{white-space:pre-wrap;color:#c4ccc3;font-size:14px;line-height:1.65;overflow-wrap:anywhere;margin:18px 0 0}
.item-actions{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.item-actions select{min-width:167px}.item-actions a{font-size:13px}
.notice{font-size:14px;color:#d8e5c7;margin:14px 0}.notice:empty{display:none}
.empty{color:#c3cfc0;padding:30px;border:1px dashed #586b51;border-radius:15px}
.hidden{display:none!important}
@media(max-width:680px){body{padding:20px 17px}.title{margin:30px 0}.auth{padding:24px 20px}.item{grid-template-columns:1fr}.item-actions{flex-direction:row;align-items:center;flex-wrap:wrap}.toolbar input{flex:1 1 100%}.stat{min-width:130px}}
</style>
</head>
<body>
<header class="head"><div class="brand">DJ <span>SAMI</span> / VERWALTUNG</div><a href="/">Zur Webseite</a></header>
<main>
<h1 class="title">AUFTRITTS<span>ANFRAGEN.</span></h1>
<section id="loginSection" class="auth" aria-label="Anmeldung zur Verwaltung">
  <h2>Geschützter Bereich</h2>
  <p>Gib den geheimen Zugangsschlüssel ein, um Buchungsanfragen zu verwalten.</p>
  <form id="loginForm"><label for="token">Zugangsschlüssel</label><input type="password" id="token" required minlength="24" autocomplete="off" placeholder="Zugangsschlüssel eingeben"><button type="submit" class="btn">Anfragen anzeigen</button></form>
</section>
<section id="dashboard" class="hidden" aria-label="Übersicht der Anfragen">
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <select id="filter" aria-label="Nach Bearbeitungsstand filtern">
      <option value="">Alle Anfragen</option>
      <option value="new">Neu</option><option value="contacted">Kontaktiert</option>
      <option value="confirmed">Bestätigt</option><option value="declined">Abgelehnt</option>
    </select>
    <input id="search" aria-label="Anfragen durchsuchen" placeholder="Name, E-Mail oder Veranstaltungsort suchen">
    <button type="button" id="refresh">Aktualisieren</button>
    <button type="button" id="csv">CSV herunterladen</button>
    <button type="button" id="logout">Abmelden</button>
  </div>
  <p class="notice" id="notice" role="status" aria-live="polite"></p>
  <div class="list" id="list"></div>
</section>
</main>
<script>
(function(){
'use strict';
var token='',rows=[];
var login=document.getElementById('loginSection');
var dashboard=document.getElementById('dashboard');
var notice=document.getElementById('notice');
var list=document.getElementById('list');
var statusLabels={new:'Neu',contacted:'Kontaktiert',confirmed:'Bestätigt',declined:'Abgelehnt'};
var typeLabels={Club:'Clubveranstaltung',Festival:'Festival',Private:'Private Feier',Corporate:'Firmenveranstaltung',Other:'Sonstiges'};
function el(tag,value,cls){
  var element=document.createElement(tag);
  if(value!==undefined)element.textContent=String(value);
  if(cls)element.className=cls;
  return element;
}
function message(value){notice.textContent=value}
function authHeaders(){return {'Authorization':'Bearer '+token,'Accept':'application/json'}}
async function load(){
  message('Anfragen werden geladen …');
  try{
    var response=await fetch('/api/bookings',{headers:authHeaders(),cache:'no-store'});
    var data=await response.json();
    if(!response.ok)throw new Error(response.status===401?'Zugangsschlüssel ist ungültig.':'Anfragen sind derzeit nicht erreichbar. Bitte die Datenbankverbindung prüfen.');
    rows=data.bookings||[];
    login.classList.add('hidden');
    dashboard.classList.remove('hidden');
    message('Die letzten '+rows.length+' Anfragen (höchstens 150) werden angezeigt.');
    render();
  }catch(error){
    message(error.message);
    if(dashboard.classList.contains('hidden'))alert(error.message);
  }
}
function render(){
  var state=document.getElementById('filter').value;
  var query=document.getElementById('search').value.trim().toLowerCase();
  var shown=rows.filter(function(r){
    return (!state||r.status===state)&&(!query||[r.name,r.email,r.location,r.event_type,r.message].join(' ').toLowerCase().includes(query));
  });
  var stats=document.getElementById('stats');
  stats.replaceChildren();
  [['Gesamt',rows.length],['Neu',rows.filter(function(r){return r.status==='new'}).length],['Kontaktiert',rows.filter(function(r){return r.status==='contacted'}).length],['Bestätigt',rows.filter(function(r){return r.status==='confirmed'}).length]].forEach(function(pair){
    var box=el('div',undefined,'stat');
    box.append(el('strong',pair[1]),el('span',pair[0]));
    stats.append(box);
  });
  list.replaceChildren();
  if(!shown.length){list.append(el('div','Keine passenden Anfragen gefunden.','empty'));return}
  shown.forEach(function(r){
    var card=el('article',undefined,'item');
    var main=el('div');
    var actions=el('div',undefined,'item-actions');
    var submitted=new Date(r.created_at);
    main.append(el('h2',r.name),el('small','Eingegangen am '+(Number.isNaN(submitted.getTime())?'unbekannt':submitted.toLocaleString('de-DE'))));
    var meta=el('div',undefined,'meta');
    [['Datum',r.event_date],['Veranstaltung',typeLabels[r.event_type]||r.event_type],['Ort',r.location],['Gäste',r.guest_count||'nicht angegeben']].forEach(function(pair){
      meta.append(el('span',pair[0]+': '+pair[1]));
    });
    main.append(meta);
    if(r.message)main.append(el('p',r.message,'message'));
    var select=el('select');
    select.setAttribute('aria-label','Bearbeitungsstand für '+r.name);
    ['new','contacted','confirmed','declined'].forEach(function(state){
      var option=el('option',statusLabels[state]);
      option.value=state;option.selected=r.status===state;select.append(option);
    });
    select.addEventListener('change',async function(){
      select.disabled=true;
      try{
        var response=await fetch('/api/bookings',{
          method:'PATCH',headers:Object.assign(authHeaders(),{'Content-Type':'application/json'}),
          body:JSON.stringify({id:r.id,status:select.value})
        });
        if(!response.ok)throw new Error('Der Bearbeitungsstand konnte nicht gespeichert werden.');
        r.status=select.value;
        message('Bearbeitungsstand für '+r.name+' gespeichert.');
        render();
      }catch(error){
        message(error.message);select.value=r.status;select.disabled=false;
      }
    });
    var mail=el('a','Per E-Mail antworten');
    mail.href='mailto:'+encodeURIComponent(r.email)+'?subject='+encodeURIComponent('DJ Sami – Anfrage für den '+r.event_date);
    actions.append(select,mail);
    card.append(main,actions);
    list.append(card);
  });
}
document.getElementById('loginForm').addEventListener('submit',function(event){
  event.preventDefault();token=document.getElementById('token').value.trim();load();
});
document.getElementById('search').addEventListener('input',render);
document.getElementById('filter').addEventListener('change',render);
document.getElementById('refresh').addEventListener('click',load);
document.getElementById('logout').addEventListener('click',function(){
  token='';rows=[];
  document.getElementById('token').value='';
  login.classList.remove('hidden');
  dashboard.classList.add('hidden');
});
document.getElementById('csv').addEventListener('click',function(){
  var cols=['id','created_at','name','email','event_type','event_date','location','guest_count','message','status'];
  function safe(value){
    var s=String(value??'');
    if(/^[=+\-@\t\r]/.test(s))s="'"+s;
    return '"'+s.replace(/"/g,'""')+'"';
  }
  var records=[cols.join(',')].concat(rows.map(function(r){return cols.map(function(key){return safe(r[key])}).join(',')})).join('\r\n');
  var blob=new Blob(['\ufeff',records],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var link=document.createElement('a');
  link.href=url;link.download='dj-sami-anfragen.csv';link.click();
  URL.revokeObjectURL(url);
});
})();
</script>
</body>
</html>
