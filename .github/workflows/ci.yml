name: Website and booking tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install self-hosted font packages
        run: npm install --no-audit --no-fund
      - name: Check JS syntax
        run: npm run check
      - name: Run booking tests
        run: npm test
      - name: Build Cloudflare Pages output
        run: npm run build
      - name: Verify output
        run: test -f dist/index.html && test -f dist/admin/index.html && test -f dist/_headers && test -f dist/fonts/syne-latin-variable.woff2 && test -f dist/fonts/manrope-latin-variable.woff2 && test ! -e dist/functions
      - name: Prepare headless browser
        run: |
          npm install --no-save playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$CHROME_PATH" ]; then
            echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Test hero on desktop and mobile
        run: node tests/hero-layout.mjs
      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dj-sami-layout
          path: artifacts/*.png
          if-no-files-found: ignore
